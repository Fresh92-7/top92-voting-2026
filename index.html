<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Fresh 92.7 — Top 92 Voting</title>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@300;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --fresh-blue:#6aaf58;
      --purple:#f6d85d;
      --cyan:#f6d85d;
      --bg:#4db563;
      --panel:#0b2113;
      --muted:#c4d2bd;
      --text:#fff9e6;
      --jungle-1:#f1cd4d; /* warm yellow from the 2026 reference */
      --jungle-2:#ffe582; /* sunlit yellow */
      --jungle-3:#dec454; /* muted golden highlight */
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:'Exo 2',system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background-color:var(--bg);
      color:var(--text);
      position:relative;
      min-height:100vh;
      overflow-x:hidden;
    }

    /* Background (matches voting page aesthetic) */

    header{display:none}

    .wrap{
      max-width:1140px;
      margin:0 auto;
      padding:16px;
    }

    main.wrap{margin-bottom:0}

    .box{
      background:rgba(7,24,13,.92);
      border:1px solid rgba(161,196,140,.12);
      border-radius:16px;
      padding:14px;
      backdrop-filter:blur(6px);
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select{
      background:#0b2113;
      border:1px solid #3f6041;
      color:var(--text);
      padding:10px 12px;
      border-radius:10px;
      outline:none;
      min-width:170px;
      min-height:44px;
    }

    label.small{
      font-size:12px;
      color:var(--muted);
    }

    .btn{
      border:0;
      border-radius:10px;
      padding:10px 12px;
      font-weight:700;
      font-family:'Exo 2',sans-serif;
      letter-spacing:.3px;
      color:#142410;
      background:linear-gradient(135deg, var(--jungle-1), var(--jungle-2) 55%, var(--jungle-3));
      box-shadow:0 6px 16px rgba(3,13,6,.30);
      cursor:pointer;
      min-height:44px;
      touch-action:manipulation;
    }

    .btn.secondary{
      background:rgba(161,196,140,.12);
      color:var(--text);
    }

    .btn.ghost{
      background:transparent;
      color:var(--text);
      border:1px solid #577249;
    }

    .btn:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:rgba(161,196,140,.12);
      border:1px solid rgba(246,216,93,.24);
      color:var(--text);
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
    }

    .votes-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin:0 0 8px;
    }

    .votes-header h3{
      margin:0;
      font-family:'Russo One',sans-serif;
      letter-spacing:.4px;
      font-size:20px;
    }

    .votes-header .pill{
      margin:0;
    }

    .az{
      display:grid;
      grid-template-columns:repeat(14, max-content);
      gap:10px;
      justify-content:flex-start;
    }

    .az-top{
      display:grid;
      grid-template-columns:minmax(0,2.2fr) minmax(260px,1.4fr);
      gap:16px;
      align-items:flex-start;
    }

    .az-left{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .az-form{
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:stretch;
      justify-content:flex-start;
    }

    .az-form-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
    }

    .az-form-grid input,
    .az-form-grid button{
      width:100%;
      min-height:44px;
    }

    .az-note{
      margin:0;
      display:block;
    }

    .az button{
      background:rgba(100,153,86,.13);
      border:1px solid rgba(246,216,93,.24);
      color:#e5edda;
      padding:6px 8px;
      border-radius:8px;
      cursor:pointer;
      font-weight:700;
      width:100%;
      min-height:36px;
      touch-action:manipulation;
    }

    .az button.active{
      border-color:transparent;
      color:#142410;
      background:linear-gradient(135deg, var(--jungle-1), var(--jungle-2) 55%, var(--jungle-3));
    }

    .az button:disabled{
      opacity:.35;
      cursor:not-allowed;
    }

    .layout{
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:16px;
    }

    @media (max-width:900px){
      .layout{grid-template-columns:1fr}
    }

    .az-wrap{
      grid-column:1 / -1;
      margin-bottom:16px;
    }

    .az-wrap .controls{
      margin-bottom:8px;
    }

    .list{
      max-height:62vh;
      overflow:auto;
      border-radius:16px;
    }

    .row{
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:10px;
      padding:10px 12px;
      border-bottom:1px solid #29432c;
      align-items:center;
    }

    .row:hover{
      background:rgba(246,216,93,.07);
    }

    .row .meta{
      display:flex;
      flex-direction:column;
    }

    .song{
      font-weight:800;
    }

    .artist{
      color:var(--muted);
      font-size:12px;
    }

    .row .actions{
      display:flex;
      gap:8px;
      align-items:center;
    }

    .selected{
      max-height:62vh;
      overflow:auto;
    }

    .sel-item{
      display:flex;
      justify-content:space-between;
      gap:8px;
      padding:10px 12px;
      border-bottom:1px solid #29432c;
    }

    .muted{
      color:var(--muted);
    }

    .counter{
      font-weight:900;
    }

    footer{
      margin:8px 0 0;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    /* Overlay logo */



    /* Desktop: logo left, interface right */
    @media (min-width:1024px){
      body{
        display:grid;
        grid-template-columns:minmax(260px,26vw) minmax(0,1fr);
        gap:32px;
        align-items:start;
        align-content:start;
        grid-auto-rows:min-content;
      }
      .wrap{
        grid-column:2;
        max-width:960px;
        margin:36px 4vw 28px 0;
      }
      #playerWrap .player-body{flex:1;gap:8px}
      #playerWrap .player-controls{flex:1;display:flex}
      #playerWrap .player-controls iframe{height:100%}
    }

    /* Mobile optimisations */
    @media (max-width:600px){
      .wrap{padding:12px}
      .az-wrap{
        padding-left:0;
        padding-right:0;
      }
      .az-top{
        align-items:stretch;
      }
      .az-left{
        width:100%;
      }
      .az-wrap .controls{
        display:grid;
        grid-template-columns:1fr;
        gap:8px;
        width:100%;
      }
      .az-wrap .controls > *{
        width:100%;
      }
      .az{
        width:100%;
        display:grid;
        grid-template-columns:repeat(7, minmax(0,1fr));
        gap:6px;
        padding-bottom:6px;
        justify-items:stretch;
      }
      .az button{
        min-width:0;
        width:100%;
        scroll-snap-align:none;
        padding:6px 4px;
        font-size:12px;
      }
      .list{max-height:58vh}
      .row{
        grid-template-columns:1fr auto;
        align-items:start;
      }
      .row .actions{gap:6px}
      .controls{gap:8px}
      .box{
        padding:12px;
        border-radius:14px;
      }
      input[type="text"],
      input[type="email"],
      input[type="tel"],
      select{
        min-width:0;
        width:100%;
      }
      footer{margin:14px 0}
      #playerWrap{
        position:fixed;
        left:50%;
        transform:translateX(-50%);
        top:72px;
        bottom:auto;
        margin:0 auto;
        max-width:420px;
        width:100%;
        padding:8px 12px 10px;
        border-radius:12px;
        display:none;
        flex-direction:column;
        gap:4px;
        min-height:auto;
        box-shadow:0 6px 18px rgba(0,0,0,.4);
        z-index:999;
        background:#081b10;
        border:1px solid #49663c;
        box-sizing:border-box;
      }
      #playerHead{
        margin-bottom:4px;
      }
      #playerWrap strong{
        font-size:15px;
      }
      #playerWrap .player-controls iframe{
        width:100%;
        height:80px;
      }
      .az-top{
        display:flex;
        flex-direction:column;
        gap:10px;
      }
      .az-form{
        order:1;
      }
      .az-left{
        order:2;
      }
      .az-form-grid{
        grid-template-columns:1fr;
        gap:8px;
      }
      .az-note{
        margin-top:2px;
      }
    }

    /* Toast */
    #toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      background:rgba(5,20,10,.96);
      color:#fff;
      border:1px solid #577249;
      border-radius:14px;
      padding:10px 14px;
      display:none;
      gap:10px;
      align-items:center;
      z-index:9999;
      box-shadow:0 8px 24px rgba(0,0,0,.35);
      transition:opacity .15s ease, transform .15s ease;
      opacity:0;
      pointer-events:none;
    }

    #toast.show{
      display:flex;
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    #toast .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#f6d85d;
      animation:bounce .9s infinite ease-in-out;
    }

    #toast .dot:nth-child(2){animation-delay:.12s}
    #toast .dot:nth-child(3){animation-delay:.24s}

    @keyframes bounce{
      0%,80%,100%{transform:scale(0.8);opacity:.6}
      40%{transform:scale(1);opacity:1}
    }

    /* Share card */
    #shareCard{
      width:1080px;
      height:1920px;
      background:#4db563 url('assets/Share%20Card%20Story%20Graphic/TOP%2092%20STORY.png') center / cover no-repeat;
      color:#07170c;
      position:absolute;
      left:0;
      top:0;
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-align:center;
      gap:24px;
      /* Keep picks between the story header and bottom artwork. */
      padding:460px 160px 430px;
      box-sizing:border-box;
    }

    #shareCard ol{
      list-style:none;
      margin:0;
      padding:0;
      width:100%;
      max-width:760px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      flex-shrink:0;
    }

    #shareCard ol li{
      margin:0;
    }

    #shareCard .share-song{
      font-family:'Russo One','Exo 2',system-ui,sans-serif;
      font-weight:700;
      font-size:var(--share-song-size,38px);
      line-height:1.18;
    }

    #shareCard .share-artist{
      font-family:'Exo 2',system-ui,sans-serif;
      font-weight:400;
      font-size:var(--share-artist-size,26px);
      line-height:1.18;
      margin-top:4px;
    }

    #status{
      font-size:14px;
      color:var(--muted);
    }

    /* Preview player desktop */
    @media (min-width:601px){
      #playerWrap{
        position:fixed;
        left:16px;
        bottom:16px;
        background:#081b10;
        border:1px solid #49663c;
        border-radius:18px;
        padding:18px;
        display:none;
        flex-direction:column;
        z-index:2;
        box-shadow:0 18px 36px rgba(0,0,0,.32);
        max-width:340px;
        width:min(340px,40vw);
        box-sizing:border-box;
        min-height:180px;
        overflow:hidden;
      }
    }

    @media (min-width:1024px){
      #playerWrap{
        left:4vw;
        right:auto;
      }
    }

    #playerHead{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
      gap:8px;
    }

    #playerWrap strong{
      font-size:16px;
      letter-spacing:.2px;
    }

    #closePlayer{
      background:transparent;
      border:1px solid #577249;
      color:#fff;
      border-radius:999px;
      padding:4px 12px;
      cursor:pointer;
      font-weight:600;
    }

    #playerWrap .player-body{
      display:none;
    }

    #playerWrap .player-controls{
      border-radius:14px;
      overflow:hidden;
      background:#051009;
    }

    #playerWrap .player-controls iframe{
      width:100%;
      border:0;
      height:180px;
      display:block;
      transform:none;
    }

    #playerWrap.youtube .player-controls iframe,
    #playerWrap.soundcloud .player-controls iframe{
      height:200px;
    }
  
    /* 2026 jungle: colour treatments only; existing layout is preserved. */
    input::placeholder{color:#a8bda1;opacity:1}
    input:focus-visible,select:focus-visible,.btn:focus-visible,.az button:focus-visible,#closePlayer:focus-visible{
      outline:2px solid #ffe582;
      outline-offset:2px;
    }
    .btn:hover:not(:disabled){filter:brightness(1.08)}
    .btn.secondary:hover:not(:disabled),.az button:hover:not(:disabled):not(.active){background:rgba(246,216,93,.15)}
    .votes-header h3{color:#ffe582}
    .pill{background:rgba(246,216,93,.10)}
    .list,.selected{scrollbar-color:#6f8e52 #0b2113}
    /* 2026 supplied event, station and sponsor artwork. */
    .brand-group{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      width:min(88vw,390px);
      margin:18px auto 6px;
      position:relative;
      z-index:3;
    }
    .brand-group img{
      display:block;
      height:auto;
      object-fit:contain;
    }
    .brand-group .brand-station{width:42%}
    .brand-group .brand-main{width:100%}
    .brand-sponsors{
      display:grid;
      grid-template-columns:1fr 1fr;
      align-items:center;
      gap:22px;
      width:74%;
    }
    .brand-sponsors img{
      width:100%;
      height:58px;
    }
    @media (min-width:1024px){
      .brand-group{
        grid-column:1;
        position:sticky;
        top:4vh;
        width:100%;
        max-width:390px;
        margin:0;
        padding:18px 12px 6px 24px;
      }
    }
    @media (max-width:600px){
      .brand-group{gap:10px}
      .brand-sponsors img{height:48px}
    }

    /* Supplied jungle artwork frames the viewport behind the interface. */
    body{isolation:isolate}
    .page-art{
      position:fixed;
      inset:0;
      z-index:-1;
      overflow:hidden;
      pointer-events:none;
      user-select:none;
    }
    .page-art img{
      position:absolute;
      display:block;
      height:auto;
    }
    .art-leaf-top-left{
      width:clamp(280px,29vw,540px);
      top:-130px;
      left:-160px;
      transform:rotate(-12deg);
    }
    .art-leaf-top-right{
      width:clamp(420px,42vw,760px);
      top:-230px;
      right:-240px;
      transform:rotate(-18deg);
    }
    .art-leaf-bottom-right{
      width:clamp(300px,33vw,600px);
      right:-135px;
      bottom:-140px;
      transform:rotate(165deg);
    }
    .art-leopard{
      width:clamp(500px,56vw,960px);
      max-width:max(0px,calc((100svh - 340px) * 1.3125));
      left:0;
      bottom:0;
      transform:translate(-41%,14%);
    }
    @media (max-width:1023px){
      .art-leopard{width:min(48vw,380px)}
    }
    @media (max-width:600px){
      .art-leaf-top-left{
        width:72vw;
        top:-12vw;
        left:-32vw;
      }
      .art-leaf-top-right{
        width:90vw;
        top:-24vw;
        right:-38vw;
      }
      .art-leaf-bottom-right{
        width:80vw;
        right:-34vw;
        bottom:-12vw;
      }
      .art-leopard{
        width:min(60vw,320px);
        transform:translate(-18%,14%);
      }
    }
</style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="songs-2025.js"></script>
</head>
<body>
  <div class="page-art" aria-hidden="true">
    <img class="art-leaf art-leaf-top-left" src="assets/Graphics/BG%20Leaf%201.png" alt="" decoding="async">
    <img class="art-leaf art-leaf-top-right" src="assets/Graphics/BG%20Leaf%202.png" alt="" decoding="async">
    <img class="art-leaf art-leaf-bottom-right" src="assets/Graphics/BG%20Leaf%201.png" alt="" decoding="async">
    <img class="art-leopard" src="assets/Graphics/leopard%20graphic.png" alt="" decoding="async">
  </div>

  <div class="brand-group" aria-label="Top 92 2026 with Fresh 92.7 and sponsors">
    <img class="brand-station" src="assets/LOGOS/Fresh927%20Logo.png" alt="Fresh 92.7">
    <img class="brand-main" src="assets/LOGOS/TOP%2092%202026%20logo-clean.png" alt="Top 92 2026">
    <div class="brand-sponsors">
      <img src="assets/LOGOS/GUTSA%20logo.png" alt="GUTSA Gutta-Liner">
      <img src="assets/LOGOS/HWY%20Hotel%20Logo.png" alt="HWY Hotel">
    </div>
  </div>

  <main class="wrap">
    <div class="box az-wrap">
      <div class="az-top">
        <div class="az-left">
          <div class="controls">
            <input id="search" type="text" placeholder="Search by song or artist…">
            <select id="viewBy">
              <option value="title">Browse by Title (A–Z)</option>
              <option value="artist">Browse by Artist (A–Z)</option>
            </select>
            <span id="status"></span>
          </div>
          <div id="az" class="az"></div>
        </div>
        <div class="az-form">
          <div class="az-form-grid">
            <input id="name" type="text" placeholder="Full name" required>
            <input id="mobile" type="tel" placeholder="Mobile" required>
            <input id="email" type="email" placeholder="Email" required>
            <button id="submitBtn" class="btn" disabled>Submit my 10 votes</button>
          </div>
          <label class="small az-note">
            We’ll email your share image and securely store your votes for tallying.
          </label>
        </div>
      </div>
    </div>

    <div class="layout">
      <div class="box">
        <div id="list" class="list" role="list"></div>
      </div>
      <div class="box">
        <div class="votes-header">
          <h3>My Votes</h3>
          <label class="pill">Selected: <span id="count" class="counter">0</span>/10</label>
        </div>
        <p class="muted" style="margin:0 0 10px">
          Tap Add/Remove to curate exactly 10.
        </p>
        <div id="selected" class="selected"></div>
      </div>
    </div>
    <footer></footer>
  </main>

  <div id="shareCard">
    <ol id="shareList" aria-label="Your Top 10 picks"></ol>
  </div>

  <div id="playerWrap">
    <div id="playerHead">
      <strong>Preview</strong>
      <button id="closePlayer">Close</button>
    </div>
    <div class="player-body">
      <div class="player-info">
        <div id="playerTitle">Choose a track to preview</div>
        <div id="playerArtist" class="muted">Preview will play below.</div>
      </div>
    </div>
    <div class="player-controls">
      <iframe id="mediaPlayer"
        allow="autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>
  </div>

  <script>
    const THANK_YOU_URL = 'thank-you.html';
    const POWER_AUTOMATE_URL = "https://defaultbfa2e364c3c248798e918c7601a4d4.38.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/f892cde2433e4ec08a61b5635447974e/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=-xW5gKIOk_fB-RxCccg-n24LpMuvrWkQCRGVleIA_bk";

    const toastEl = document.createElement('div');
    function showToast(msg){
      const t = document.getElementById('toast') || toastEl;
      const txt = document.getElementById('toastText');
      if (txt && msg) txt.textContent = msg;
      if (t && t.classList){
        t.classList.add('show');
        t.style.display = 'flex';
      }
    }
    function hideToast(){
      const t = document.getElementById('toast');
      if (!t) return;
      t.classList.remove('show');
      setTimeout(()=>{ t.style.display='none'; }, 150);
    }

    let songs = (window.SONGS_2025 || []).slice();

    const selected = new Map();
    let currentLetter = 'All';
    let viewBy = 'title';
    let query = '';

    const listEl    = document.getElementById('list');
    const selEl     = document.getElementById('selected');
    const countEl   = document.getElementById('count');
    const azEl      = document.getElementById('az');
    const searchEl  = document.getElementById('search');
    const viewByEl  = document.getElementById('viewBy');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl  = document.getElementById('status');
    const nameEl    = document.getElementById('name');
    const mobileEl  = document.getElementById('mobile');
    const emailEl   = document.getElementById('email');

    function buildAZ(){
      azEl.innerHTML = '';
      const letters = new Set(
        songs
          .map(s => (s[viewBy] || '').trim()[0]?.toUpperCase())
          .filter(Boolean)
      );
      const hasNonAlpha = songs.some(s => {
        const ch = (s[viewBy] || '').trim()[0];
        return ch && !/[A-Za-z]/.test(ch);
      });

      const allBtn = document.createElement('button');
      allBtn.textContent = 'All';
      allBtn.className = 'active';
      allBtn.addEventListener('click', () => {
        currentLetter = 'All';
        setAZActive(allBtn);
        renderList();
      });
      azEl.appendChild(allBtn);

      'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch => {
        const btn = document.createElement('button');
        btn.textContent = ch;
        if (!letters.has(ch)) btn.disabled = true;
        btn.addEventListener('click', () => {
          currentLetter = ch;
          setAZActive(btn);
          renderList();
        });
        azEl.appendChild(btn);
      });

      const hashBtn = document.createElement('button');
      hashBtn.textContent = '#';
      if (!hasNonAlpha) hashBtn.disabled = true;
      hashBtn.addEventListener('click', () => {
        currentLetter = '#';
        setAZActive(hashBtn);
        renderList();
      });
      azEl.appendChild(hashBtn);
    }

    function setAZActive(activeBtn){
      azEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      activeBtn.classList.add('active');
    }

    function renderList(){
      listEl.innerHTML = '';

      if (!songs.length){
        const n = document.createElement('div');
        n.className = 'muted';
        n.style.padding = '16px';
        n.textContent = 'No songs available.';
        listEl.appendChild(n);
        return;
      }

      const q = query.toLowerCase();
      const filtered = songs
        .filter(s => {
          const matchesQuery = q
            ? (`${s.title} ${s.artist}`.toLowerCase().includes(q))
            : true;

          const rawFirst = (s[viewBy] || '').trim()[0] || '';
          const first = rawFirst.toUpperCase();

          let matchesLetter;
          if (currentLetter === 'All'){
            matchesLetter = true;
          } else if (currentLetter === '#'){
            matchesLetter = rawFirst && !/[A-Za-z]/.test(rawFirst);
          } else {
            matchesLetter = (first === currentLetter);
          }

          return matchesQuery && matchesLetter;
        })
        .sort((a, b) => (a[viewBy] || '').localeCompare(b[viewBy] || ''));

      if (!filtered.length){
        const empty = document.createElement('div');
        empty.className = 'muted';
        empty.style.padding = '16px';
        empty.textContent = 'No songs match your filters.';
        listEl.appendChild(empty);
        return;
      }

      filtered.forEach(s => {
        const key = `${s.artist} — ${s.title}`;
        const row = document.createElement('div');
        row.className = 'row';

        const meta = document.createElement('div');
        meta.className = 'meta';

        const t = document.createElement('div');
        t.className = 'song';
        t.textContent = s.title;

        const a = document.createElement('div');
        a.className = 'artist';
        a.textContent = s.artist;

        meta.appendChild(t);
        meta.appendChild(a);

        const actions = document.createElement('div');
        actions.className = 'actions';

        const preview = document.createElement('button');
        preview.className = 'btn secondary';
        preview.textContent = 'Preview';
        preview.title = 'Play preview';
        preview.disabled = !(s.spotify || s.youtube || s.soundcloud);
        preview.addEventListener('click', () => openPreview(s));

        const add = document.createElement('button');
        add.className = 'btn';
        add.textContent = selected.has(key) ? 'Remove' : 'Add';
        add.style.minWidth = '92px';
        add.addEventListener('click', () => toggleSelect(s));

        actions.appendChild(preview);
        actions.appendChild(add);

        row.appendChild(meta);
        row.appendChild(actions);
        listEl.appendChild(row);
      });

      refreshButtonsEnabled();
    }

    function toggleSelect(song){
      const key = `${song.artist} — ${song.title}`;
      if (selected.has(key)){
        selected.delete(key);
      } else {
        if (selected.size >= 10){
          alert('You can only select exactly 10 songs. Remove one to add another.');
          return;
        }
        selected.set(key, song);
      }
      updateSelectedUI();
      renderList();
    }

    function updateSelectedUI(){
      selEl.innerHTML = '';
      const arr = Array.from(selected.values());
      arr.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = 'sel-item';
        item.innerHTML =
          `<div><strong>${idx+1}.</strong> ${s.title} <span class="muted">— ${s.artist}</span></div>`;
        const rm = document.createElement('button');
        rm.className = 'btn ghost';
        rm.textContent = 'Remove';
        rm.addEventListener('click', () => {
          selected.delete(`${s.artist} — ${s.title}`);
          updateSelectedUI();
          renderList();
        });
        item.appendChild(rm);
        selEl.appendChild(item);
      });
      countEl.textContent = selected.size;
      validateForm();
    }

    function refreshButtonsEnabled(){
      if (selected.size >= 10){
        listEl.querySelectorAll('.row').forEach(row => {
          const title = row.querySelector('.song').textContent;
          const artist = row.querySelector('.artist').textContent;
          const key = `${artist} — ${title}`;
          const btns = row.querySelectorAll('.btn');
          const addBtn = btns[btns.length - 1];
          if (!selected.has(key)){
            addBtn.disabled = true;
            addBtn.textContent = 'Full';
          } else {
            addBtn.disabled = false;
            addBtn.textContent = 'Remove';
          }
        });
      } else {
        listEl.querySelectorAll('.row').forEach(row => {
          const title = row.querySelector('.song').textContent;
          const artist = row.querySelector('.artist').textContent;
          const key = `${artist} — ${title}`;
          const btns = row.querySelectorAll('.btn');
          const addBtn = btns[btns.length - 1];
          addBtn.disabled = false;
          addBtn.textContent = selected.has(key) ? 'Remove' : 'Add';
        });
      }
    }

    searchEl.addEventListener('input', e => {
      query = e.target.value;
      currentLetter = 'All';
      setAZActive(azEl.querySelector('button'));
      renderList();
    });

    viewByEl.addEventListener('change', e => {
      viewBy = e.target.value;
      currentLetter = 'All';
      buildAZ();
      renderList();
    });

    const playerWrap      = document.getElementById('playerWrap');
    const player          = document.getElementById('mediaPlayer');
    const playerTitleEl   = document.getElementById('playerTitle');
    const playerArtistEl  = document.getElementById('playerArtist');
    const closePlayerBtn  = document.getElementById('closePlayer');

    closePlayerBtn.addEventListener('click', () => {
      playerWrap.style.display = 'none';
      playerWrap.classList.remove('spotify','youtube','soundcloud');
      player.src = '';
      if (playerTitleEl) playerTitleEl.textContent = 'Choose a track to preview';
      if (playerArtistEl) playerArtistEl.textContent = 'Preview will play below.';
    });

    function openPreview(song){
      if (!song) return;

      let src = '';
      let height = 152;
      let isSpotify = false;

      playerWrap.classList.remove('spotify', 'youtube', 'soundcloud');

      if (playerTitleEl) playerTitleEl.textContent = song.title || 'Preview';
      if (playerArtistEl) playerArtistEl.textContent = song.artist || '';

      if (song.spotify){
        let url = song.spotify;
        if (!url.startsWith('http')){
          url = `https://open.spotify.com/track/${url}`;
        }
        const embedUrl = new URL(url);
        embedUrl.pathname = embedUrl.pathname.replace(/^\/track\//, '/embed/track/');
        embedUrl.search = new URLSearchParams({ utm_source: 'generator', theme: '0' }).toString();
        embedUrl.hash = '';
        src = embedUrl.toString();
        height = 152;
        playerWrap.classList.add('spotify');
        isSpotify = true;
      }
      else if (song.youtube){
        let yt = String(song.youtube).trim();
        const srcAttr = yt.match(/src\s*=\s*"([^"]+)"/i);
        if (srcAttr) yt = srcAttr[1];
        const idMatch = yt.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{6,})/);
        const id = idMatch ? idMatch[1] : '';
        if (id){
          src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
          height = 180;
          playerWrap.classList.add('youtube');
        }
      }
      else if (song.soundcloud){
        const sc = encodeURIComponent(song.soundcloud.trim());
        src = `https://w.soundcloud.com/player/?url=${sc}&auto_play=true&hide_related=true&show_comments=false&visual=false`;
        height = 180;
        playerWrap.classList.add('soundcloud');
      }

      if (!src) return;

      player.setAttribute('allowfullscreen', '');
      player.style.height = height + 'px';

      if (player._autoplayHandler){
        player.removeEventListener('load', player._autoplayHandler);
        player._autoplayHandler = null;
      }

      if (isSpotify){
        const tryPlay = () => {
          try { player.contentWindow.postMessage({ command: 'play' }, '*'); } catch(e){}
          try { player.contentWindow.postMessage(JSON.stringify({ command: 'play' }), '*'); } catch(e){}
        };

        const onLoad = () => {
          // Ensure this handler only runs once per load
          player.removeEventListener('load', onLoad);
          player._autoplayHandler = null;

          // Single, slightly delayed play trigger to avoid the start/stop glitch
          setTimeout(tryPlay, 220);
        };

        player._autoplayHandler = onLoad;
        player.addEventListener('load', onLoad);
      }

      player.src = src;
      playerWrap.style.display = 'flex';
    }

    [nameEl, mobileEl, emailEl].forEach(el =>
      el.addEventListener('input', validateForm)
    );

    function validateForm(){
      const ok =
        selected.size === 10 &&
        nameEl.value.trim() &&
        mobileEl.value.trim() &&
        emailEl.value.trim();
      submitBtn.disabled = !ok;
    }

    submitBtn.addEventListener('click', handleSubmit);

    function fitShareCardText(card, shareList){
      const cardStyle = getComputedStyle(card);
      const availableHeight = card.clientHeight
        - parseFloat(cardStyle.paddingTop)
        - parseFloat(cardStyle.paddingBottom);
      let songSize = 38;

      card.style.setProperty('--share-song-size', songSize + 'px');
      card.style.setProperty('--share-artist-size', '26px');

      while (shareList.scrollHeight > availableHeight && songSize > 18){
        songSize -= 1;
        card.style.setProperty('--share-song-size', songSize + 'px');
        card.style.setProperty('--share-artist-size', Math.round(songSize * 26 / 38) + 'px');
      }
    }

    async function handleSubmit(){
      if (submitBtn.disabled) return;

      const oldBtnText = submitBtn.textContent;
      submitBtn.textContent = 'Sending from Digital@fresh927.com.au…';
      submitBtn.style.opacity = '0.8';
      statusEl.textContent = 'Generating your share image…';
      submitBtn.disabled = true;
      showToast('Submitting your vote… sending from Digital@fresh927.com.au');

      const shareList = document.getElementById('shareList');
      shareList.innerHTML = '';

      const picksArr = Array.from(selected.values());

      picksArr.forEach(song => {
        const li = document.createElement('li');

        const titleEl = document.createElement('div');
        titleEl.className = 'share-song';
        titleEl.textContent = song.title || '';

        const artistEl = document.createElement('div');
        artistEl.className = 'share-artist';
        artistEl.textContent = song.artist || '';

        li.appendChild(titleEl);
        if (artistEl.textContent){
          li.appendChild(artistEl);
        }

        shareList.appendChild(li);
      });

      const card = document.getElementById('shareCard');
      let dataURL = '';
      try{
        card.style.display = 'flex';
        await document.fonts.ready;
        fitShareCardText(card, shareList);
        const canvas = await html2canvas(card, {
          backgroundColor:null,
          scale:1,
          useCORS:true,
          allowTaint:true
        });
        dataURL = canvas.toDataURL('image/jpeg', 0.92);
      }catch(err){
        console.warn('html2canvas failed; continuing without image', err);
      }finally{
        card.style.display = 'none';
      }

      // To keep picks_json as before (array of "title — artist" strings)
      const picks_json = picksArr.map(s => `${s.title} — ${s.artist}`);

      if (POWER_AUTOMATE_URL){
        try{
          const payload = {
            name: nameEl.value.trim(),
            mobile: mobileEl.value.trim(),
            email: emailEl.value.trim(),
            picks_json: picks_json,
            imageDataUrl: dataURL,
            ua: navigator.userAgent
          };

          const goThanks = (() => {
            let done = false;
            return () => {
              if (done) return;
              done = true;
              setTimeout(() => {
                try { window.location.replace(THANK_YOU_URL); }
                catch { window.location.href = THANK_YOU_URL; }
              }, 50);
            };
          })();

          fetch(POWER_AUTOMATE_URL, {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body:JSON.stringify(payload)
          })
          .catch(err => {
            console.error('[Top92] POST error:', err);
          })
          .finally(() => {
            goThanks();
          });

          setTimeout(goThanks, 1500);

        }catch(err){
          hideToast();
          submitBtn.textContent = oldBtnText;
          submitBtn.style.opacity = '1';
          submitBtn.disabled = false;
          console.error(err);
          statusEl.textContent =
            'We saved your vote, but emailing the image failed. A preview will open — save it manually.';
          const win = window.open();
          if (win){
            const img = new Image();
            img.src = dataURL;
            win.document.body.style.margin = '0';
            win.document.body.appendChild(img);
          }
        }
      } else {
        showToast('Submitting your vote…');
        statusEl.textContent =
          'Almost there! We could not send the email because the endpoint is not set. A preview will open — save it.';
        const win = window.open();
        if (win){
          const img = new Image();
          img.src = dataURL;
          win.document.body.style.margin = '0';
          win.document.body.appendChild(img);
        }
        window.location.replace(THANK_YOU_URL);
      }

      setTimeout(() => {
        submitBtn.textContent = oldBtnText;
        submitBtn.style.opacity = '1';
        submitBtn.disabled = false;
        hideToast();
      }, 6000);
    }

    buildAZ();
    renderList();
    updateSelectedUI();
  </script>

  <div id="toast" role="status" aria-live="polite" aria-atomic="true">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span id="toastText">Submitting…</span>
  </div>
</body>
</html>
