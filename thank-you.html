<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Thank You — Fresh 92.7 Top 92 of 2025</title>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@300;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#4db563;
      --text:#fff9e6;
      --muted:#c4d2bd;
      --panel-bg:rgba(7,24,13,.94);
      --panel-border:rgba(246,216,93,.24);
      /* Same jungle palette as voting page */
      --jungle-1:#f1cd4d;
      --jungle-2:#ffe582;
      --jungle-3:#dec454;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      margin:0;
      font-family:'Exo 2',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background-color:var(--bg);
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
    }

    /* MATCH voting page background */

    /* DESKTOP LAYOUT:
       same 2-col grid as voting page:
       - left: logo column (26vw)
       - right: content column
    */
    body{
      display:grid;
      grid-template-columns:minmax(260px,26vw) minmax(0,1fr);
      gap:32px;
      align-items:start;
      align-content:start;
      grid-auto-rows:min-content;
    }

    /* MATCH overlay-logo from voting page */

    /* Right column wrapper */
    main.wrap{
      grid-column:2;
      max-width:960px;
      margin:36px 4vw 28px 0;
      padding:0 16px 32px;
      display:flex;
      align-items:center;       /* vertical centering */
      justify-content:flex-start;
      min-height:calc(100vh - 72px);
    }

    .thank-card{
      width:100%;
      background:var(--panel-bg);
      border:1px solid var(--panel-border);
      border-radius:24px;
      padding:26px 32px 24px;
      box-shadow:0 22px 48px rgba(0,0,0,.65);
      backdrop-filter:blur(10px);
    }

    .thank-card h1{
      font-family:'Russo One',sans-serif;
      font-size:clamp(26px,3.2vw,40px);
      letter-spacing:.5px;
      margin:0 0 14px;
    }

    .thank-card p{
      margin:0 0 6px;
      font-size:16px;
      color:var(--muted);
    }

    .thank-card p:last-of-type{
      margin-bottom:18px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:11px 24px;
      border-radius:14px;
      border:0;
      font-weight:800;
      font-family:'Exo 2',sans-serif;
      letter-spacing:.25px;
      text-decoration:none;
      color:#142410;
      background:linear-gradient(135deg,var(--jungle-1),var(--jungle-2) 55%,var(--jungle-3));
      box-shadow:0 8px 22px rgba(0,0,0,.38);
      cursor:pointer;
    }

    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 12px 26px rgba(0,0,0,.5);
    }

    .btn:active{
      transform:translateY(1px);
      box-shadow:0 4px 14px rgba(0,0,0,.35);
    }

    /* MOBILE / TABLET */
    @media (max-width:900px){
      body{
        display:block;
      }



      main.wrap{
        margin:12px auto 32px;
        padding:0 16px;
        min-height:0;
        display:flex;
        align-items:flex-start;
        justify-content:center;
      }

      .thank-card{
        margin-top:16px;
        padding:22px 18px 20px;
        border-radius:18px;
      }
    }

    @media (max-width:600px){
      .thank-card h1{
        font-size:22px;
      }
      .thank-card p{
        font-size:14px;
      }
    }

  
    /* 2026 jungle: colour treatments only; existing layout is preserved. */
    .thank-card h1{color:#ffe582}
    .btn:focus-visible{outline:2px solid #fff9e6;outline-offset:2px}
    /* 2026 supplied event, station and sponsor artwork. */
    .brand-group{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      width:min(88vw,390px);
      margin:18px auto 6px;
      position:relative;
      z-index:3;
    }
    .brand-group img{
      display:block;
      height:auto;
      object-fit:contain;
    }
    .brand-group .brand-station{width:42%}
    .brand-group .brand-main{width:100%}
    .brand-sponsors{
      display:grid;
      grid-template-columns:1fr 1fr;
      align-items:center;
      gap:22px;
      width:74%;
    }
    .brand-sponsors img{
      width:100%;
      height:58px;
    }
    @media (min-width:901px){
      .brand-group{
        grid-column:1;
        position:sticky;
        top:4vh;
        width:100%;
        max-width:390px;
        margin:0;
        padding:18px 12px 6px 24px;
      }
    }
    @media (max-width:600px){
      .brand-group{gap:10px}
      .brand-sponsors img{height:48px}
    }
</style>
</head>
<body>
  <!-- Same logo + position as main page -->
  <div class="brand-group" aria-label="Top 92 2026 with Fresh 92.7 and sponsors">
    <img class="brand-station" src="assets/LOGOS/Fresh927%20Logo.png" alt="Fresh 92.7">
    <img class="brand-main" src="assets/LOGOS/TOP%2092%202026%20logo-clean.png" alt="Top 92 2026">
    <div class="brand-sponsors">
      <img src="assets/LOGOS/GUTSA%20logo.png" alt="GUTSA Gutta-Liner">
      <img src="assets/LOGOS/HWY%20Hotel%20Logo.png" alt="HWY Hotel">
    </div>
  </div>

  <main class="wrap">
    <div class="thank-card">
      <h1>Thank you for voting in Fresh 92.7's Top 92 of 2025!</h1>
      <p>Your votes have been sent to your email for you to share.</p>
      <p>See you at the Pier Glenelg on January 17!</p>
      <a href="index.html" class="btn">
        Back to voting
      </a>
    </div>
  </main>
</body>
</html>
